<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X 书签每日回顾</title>
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#today"><span class="logo" aria-hidden="true"></span><b>书签回顾</b></a>
      <nav class="tabs" role="tablist" aria-label="页面">
        <button class="tab" role="tab" data-tab="today" type="button">今日回顾</button>
        <button class="tab" role="tab" data-tab="library" type="button">全部书签</button>
        <button class="tab" role="tab" data-tab="settings" type="button">设置</button>
      </nav>
      <button id="syncBtn" class="btn btn-ghost" type="button" title="打开 X 书签页,读取最新的书签">⟳ 同步</button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main>
    <section id="view-today" class="view" hidden></section>
    <section id="view-library" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
    <footer class="site-footer">
      <a class="site-footer-link" href="https://github.com/1137109905-byte/x-bookmark-daily-review" target="_blank" rel="noopener noreferrer">
        <svg class="fj-mark" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="1.5" y="1.5" width="21" height="21" rx="6" stroke="currentColor" stroke-width="1.5" opacity="0.55"></rect>
          <path d="M6.5 9.5C9.5 7.5 13 7.5 15.8 9.2C17 9.9 18 9.3 18 8.1" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"></path>
          <path d="M6.5 13.2C10 11.4 13.5 11.8 16.8 13.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.85"></path>
          <path d="M6.5 16.5C9.2 15.4 11.6 15.6 13.6 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.55"></path>
        </svg>
        <span>made by 风锦 · 开源于 GitHub</span>
      </a>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="lib/plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
