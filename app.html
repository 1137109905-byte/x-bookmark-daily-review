<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X 书签每日回顾</title>
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#today"><span class="logo" aria-hidden="true"></span><b>书签回顾</b></a>
      <nav class="tabs" role="tablist" aria-label="页面">
        <button class="tab" role="tab" data-tab="today" type="button">今日回顾</button>
        <button class="tab" role="tab" data-tab="library" type="button">全部书签</button>
        <button class="tab" role="tab" data-tab="settings" type="button">设置</button>
      </nav>
      <button id="syncBtn" class="btn btn-ghost" type="button" title="打开 X 书签页,读取最新的书签">⟳ 同步</button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main>
    <section id="view-today" class="view" hidden></section>
    <section id="view-library" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="lib/plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
